type User @table {
  username: String!
  email: String!
  createdAt: Timestamp!
  dob: Date
  cognitiveChallenges: [String]
  lastLogin: Timestamp
}

type GameType @table {
  name: String!
  description: String!
  primaryCognitiveArea: String!
  recommendedDurationMinutes: Int
}

type TrainingSession @table {
  user: User!
  gameType: GameType!
  startTime: Timestamp!
  endTime: Timestamp!
  difficultyLevelStart: Int!
  difficultyLevelEnd: Int!
  score: Int!
  feedback: String
  notes: String
}

type PerformanceMetric @table {
  user: User!
  gameType: GameType!
  date: Date!
  averageScore: Float!
  highestScore: Int!
  totalSessions: Int!
  cognitiveImprovementRate: Float
  averageDifficultyLevel: Float
}

type GameSetting @table {
  user: User!
  settingName: String!
  settingValue: String!
  lastUpdated: Timestamp
}