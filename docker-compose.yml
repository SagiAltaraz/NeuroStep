services:
   # ── REST API + frontend static build ──────────────────────────
   # VITE_ vars must be passed at build time (Vite bakes them in at compile)
   # Fill frontend/.env first, then docker-compose up --build
   app:
      build:
         context: .
         dockerfile: Dockerfile
         args:
            VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
            VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
            VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001}
      ports:
         - '3000:3000'
      env_file:
         - ./backend/.env
      command: sh -c "bun install && bun run dev"
      volumes:
         - ./backend:/app/backend
         - /app/backend/node_modules
      restart: unless-stopped

   frontend:
      image: oven/bun:1
      working_dir: /frontend
      command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 5173"
      ports:
         - '5173:5173'
      environment:
         API_PROXY_TARGET: http://app:3000
      volumes:
         - ./frontend:/frontend
         - /frontend/node_modules
      depends_on:
         - app
      restart: unless-stopped

   game-server:
      build:
         context: ./game-server
         dockerfile: Dockerfile
      ports:
         - '3001:3001'
      env_file:
         - ./backend/.env
      environment:
         KAFKA_BROKER: kafka:29092
      depends_on:
         kafka:
            condition: service_healthy
      restart: unless-stopped

   zookeeper:
      image: confluentinc/cp-zookeeper:7.6.0
      container_name: neurostep-zookeeper
      environment:
         ZOOKEEPER_CLIENT_PORT: 2181
         ZOOKEEPER_TICK_TIME: 2000
      ports:
         - '2181:2181'

   kafka:
      image: confluentinc/cp-kafka:7.6.0
      container_name: neurostep-kafka
      depends_on:
         - zookeeper
      ports:
         - '9092:9092'
      environment:
         KAFKA_BROKER_ID: 1
         KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
         KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
         KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
         KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
         KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
         KAFKA_LOG_RETENTION_HOURS: 168
      healthcheck:
         test:
            [
               'CMD',
               'kafka-topics',
               '--bootstrap-server',
               'localhost:9092',
               '--list',
            ]
         interval: 10s
         timeout: 10s
         retries: 10

   kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: neurostep-kafka-ui
      depends_on:
         - kafka
      ports:
         - '8080:8080'
      environment:
         KAFKA_CLUSTERS_0_NAME: neurostep-local
         KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      restart: unless-stopped
