# Auto-deploy on every push to main.
# On push → SSH into the DigitalOcean droplet → sync to main → rebuild & restart.
#
# Add these repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST  = droplet public IP (165.22.85.201)
#   SSH_USER  = root
#   SSH_KEY   = the PRIVATE deploy key whose public half is in the droplet's authorized_keys
#   APP_DIR   = /root/NeuroStep

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git fetch origin main
            git checkout -B main origin/main   # force server to match main (ignores tracked drift; .env is untracked so it's kept)
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
