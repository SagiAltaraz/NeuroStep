# Auto-deploy on every push to main.
# On push → SSH into the Oracle VM → pull latest → rebuild & restart containers.
#
# Add these repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST  = your VM public IP
#   SSH_USER  = ubuntu   (default for Oracle Ubuntu images)
#   SSH_KEY   = the PRIVATE key whose public half is on the VM
#   APP_DIR   = absolute path of the repo on the VM, e.g. /home/ubuntu/NeuroStep

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
